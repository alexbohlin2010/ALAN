<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALAN globe prototype</title>
  <!-- Cormorant Garamond italic for the intro line (human, AI_LOG Copy editing step 13: Google Fonts link). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&display=swap">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="arriving">
  <div id="globe"></div>
  <nav id="modes" aria-label="Sections">
    <button class="mode" data-mode="light">Light</button>
    <ol class="steps" data-part="1"></ol>
    <button class="mode" data-mode="impacts">Impacts</button>
    <ol class="steps" data-part="2"></ol>
    <button class="mode" data-mode="explore">Explore</button>
    <ol class="steps" data-part="3"></ol>
  </nav>
  <div id="swipe"><div class="line"></div><div class="handle" aria-label="Drag to compare years"></div><span class="tag left">2015</span><span class="tag right">2025</span></div>
  <div class="year left">2015</div>
  <div class="year right">2025</div>
  <button id="info" aria-label="About the map colours" aria-expanded="false">i</button>
  <div id="legend" hidden></div>
  <div id="card" hidden></div>
  <div id="fact" hidden></div>
  <div id="study" hidden></div>
  <div id="nav"><button class="back" aria-label="Previous step">‹</button><span class="count"></span><button class="next" aria-label="Next step">›</button></div>
  <div id="intro" hidden><div class="text"></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
